theme: minima
title: Amberfold Bees
author: roncewind, the wizzard
description: Hive notes and buzz about the bees.

exclude:
  - CLAUDE.md
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor

collections:
  colonies:
    output: true
    permalink: /colonies/:path/

defaults:
  - scope:
      path: ""
      type: colonies
    values:
      layout: colony
